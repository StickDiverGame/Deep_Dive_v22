<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="100%" height="100%">
  <defs>
    <!-- Metallic chrome gradient for valve, 1st stage, fittings & SPG rim -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Chrome across horizontal width (for cylindrical sleeves) -->
    <linearGradient id="chromeCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Cylinder body gradient matching game ocean palette -->
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="20%" stop-color="#3a7ebd" />
      <stop offset="50%" stop-color="#5b9bd5" />
      <stop offset="80%" stop-color="#245682" />
      <stop offset="100%" stop-color="#0e2338" />
    </linearGradient>

    <!-- Fluted rubber handwheels & hose gradient -->
    <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 1st stage regulator radial chrome body -->
    <radialGradient id="regChrome" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- High-visibility yellow purge face for Octopus -->
    <radialGradient id="octoYellow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>

    <!-- Rubber valve handwheel knob -->
    <g id="handwheel">
      <rect x="-7" y="-11" width="14" height="22" rx="3.5" fill="url(#rubberGrad)" stroke="#0f172a" stroke-width="1.2" />
      <line x1="-4" y1="-7" x2="-4" y2="7" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="4" y1="-7" x2="4" y2="7" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
      <rect x="-3" y="9" width="6" height="4" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8" />
    </g>

    <!-- Primary 2nd Stage Regulator Component -->
    <g id="secondStagePrimary">
      <circle cx="0" cy="0" r="9.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" />
      <circle cx="0" cy="0" r="6.5" fill="#334155" />
      <circle cx="0" cy="0" r="3.5" fill="var(--color-gear, #c89567)" />
      <!-- Mouthpiece -->
      <path d="M-3.5 -9.5 L3.5 -9.5 L2.5 -14 L-2.5 -14 Z" fill="#0f172a" />
      <!-- Hose swivel collar -->
      <rect x="-13" y="-3.5" width="4.5" height="7" rx="1" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8" />
    </g>

    <!-- Octopus 2nd Stage Regulator Component (High-Vis Yellow) -->
    <g id="secondStageOcto">
      <circle cx="0" cy="0" r="9.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" />
      <circle cx="0" cy="0" r="6.5" fill="url(#octoYellow)" stroke="#ca8a04" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3.5" fill="#eab308" />
      <!-- Mouthpiece -->
      <path d="M-3.5 -9.5 L3.5 -9.5 L2.5 -14 L-2.5 -14 Z" fill="#0f172a" />
      <!-- Hose swivel collar -->
      <rect x="-13" y="-3.5" width="4.5" height="7" rx="1" fill="url(#chromeGrad)" stroke="#334155" stroke-width="0.8" />
    </g>

    <!-- SPG Pressure Gauge Component -->
    <g id="spg">
      <circle cx="0" cy="0" r="11" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1.4" />
      <circle cx="0" cy="0" r="8.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8" />
      <!-- Dial tick markings -->
      <path d="M -5 3.5 A 6 6 0 1 1 5 3.5" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="1.2 1.2" />
      <!-- Red reserve zone (<50 bar) -->
      <path d="M -5 3.5 A 6 6 0 0 1 -4.2 -4.2" fill="none" stroke="#ef4444" stroke-width="1.4" />
      <!-- Needle & pivot -->
      <line x1="0" y1="0" x2="3" y2="-5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="1.3" fill="#0f172a" />
      <!-- Rubber boot -->
      <rect x="-3" y="10" width="6" height="5" fill="#1e293b" />
    </g>

    <!-- ================= BCD QUICK-DISCONNECT COUPLER ================= -->
    <g id="qdFitting">
      <!-- 1. Rubber hose strain relief boot / protector sleeve -->
      <path d="M -3 -12 L 3 -12 L 3.5 -8 L -3.5 -8 Z" fill="#0f172a" stroke="#1e293b" stroke-width="0.6"/>
      <rect x="-3" y="-14" width="6" height="2.5" rx="0.5" fill="#1e293b"/>

      <!-- 2. Hex crimp ferrule (threads onto LP hose) -->
      <rect x="-4.5" y="-8" width="9" height="5" rx="0.8" fill="url(#chromeCylinder)" stroke="#334155" stroke-width="0.8"/>
      <line x1="-1.5" y1="-8" x2="-1.5" y2="-3" stroke="#64748b" stroke-width="0.6"/>
      <line x1="1.5" y1="-8" x2="1.5" y2="-3" stroke="#64748b" stroke-width="0.6"/>

      <!-- 3. Base collar step -->
      <rect x="-5" y="-3" width="10" height="2" fill="url(#chromeCylinder)" stroke="#334155" stroke-width="0.6"/>

      <!-- 4. SLIDING RELEASE COLLAR (wider spring-loaded outer sleeve) -->
      <rect x="-6.5" y="-1" width="13" height="10" rx="1.5" fill="url(#chromeCylinder)" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Knurled finger-grip bands on the release sleeve -->
      <line x1="-5.5" y1="1" x2="5.5" y2="1" stroke="#334155" stroke-width="0.9"/>
      <line x1="-5.5" y1="2.6" x2="5.5" y2="2.6" stroke="#475569" stroke-width="0.8"/>
      <line x1="-5.5" y1="4.2" x2="5.5" y2="4.2" stroke="#334155" stroke-width="0.9"/>
      <line x1="-5.5" y1="5.8" x2="5.5" y2="5.8" stroke="#475569" stroke-width="0.8"/>
      <line x1="-5.5" y1="7.4" x2="5.5" y2="7.4" stroke="#334155" stroke-width="0.9"/>

      <!-- Cross-hatch micro-knurl ticks -->
      <line x1="-4" y1="1" x2="-4" y2="7.4" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="0.8 0.8"/>
      <line x1="-1.5" y1="1" x2="-1.5" y2="7.4" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="0.8 0.8"/>
      <line x1="1.5" y1="1" x2="1.5" y2="7.4" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="0.8 0.8"/>
      <line x1="4" y1="1" x2="4" y2="7.4" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="0.8 0.8"/>

      <!-- 5. Front lip collar of female socket -->
      <rect x="-5.5" y="9" width="11" height="2.5" rx="0.6" fill="url(#chromeCylinder)" stroke="#334155" stroke-width="0.7"/>
      
    </g>
  </defs>

  <!-- ================= SINGLE CYLINDER ================= -->
  <g id="singleCylinder">
    <!-- Neck -->
    <rect x="129" y="50" width="22" height="7" rx="1.5" fill="url(#chromeGrad)" stroke="#0f2942" stroke-width="1" />
    <!-- Tank Body -->
    <path d="M 112 82 C 112 57, 127 55, 140 55 C 153 55, 168 57, 168 82 L 168 252 C 168 262, 112 262, 112 252 Z"
      fill="url(#tankGrad)" stroke="#0f2942" stroke-width="1.8" />
    <!-- Rubber Boot -->
    <path d="M 111 244 L 169 244 L 169 252 C 169 260, 111 260, 111 252 Z" fill="#0f172a" opacity="0.65" />
  </g>

  <!-- ================= VALVE & FIRST STAGE ================= -->
  <!-- Cylinder Valve Pillar -->
  <rect x="131" y="34" width="18" height="17" rx="2" fill="url(#chromeGrad)" stroke="#0f2942" stroke-width="1.2" />

  <!-- Horizontal Valve Stem extending left -->
  <rect x="113" y="38" width="18" height="8" rx="1" fill="url(#chromeGrad)" stroke="#1e293b" stroke-width="0.8" />
  <!-- Valve Knob pointing left -->
  <g transform="translate(108, 42) rotate(-90)">
    <use href="#handwheel" />
  </g>

  <!-- 1st Stage Regulator Body mounted on valve -->
  <g id="firstStage">
    <rect x="135" y="24" width="10" height="10" rx="1.5" fill="#1e293b" stroke="#0f172a" stroke-width="1" />
    <rect x="132" y="14" width="16" height="12" rx="3" fill="url(#regChrome)" stroke="#0f2942" stroke-width="1.2" />
    <circle cx="140" cy="19" r="3" fill="url(#chromeGrad)" />
  </g>

  <!-- ================= 4 HOSES ================= -->

  <!-- HOSE 1: PRIMARY REGULATOR (TOP LEFT) -->
  <path d="M 132 20 C 102 12, 68 20, 52 50"
    fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <path d="M 132 20 C 102 12, 68 20, 52 50"
    fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="0.7" />
  <g transform="translate(48, 54) rotate(-35)">
    <use href="#secondStagePrimary" />
  </g>

  <!-- HOSE 2: OCTOPUS REGULATOR (BOTTOM LEFT, LONGER) -->
  <path d="M 132 26 C 75 35, 34 95, 36 160 C 38 205, 48 235, 72 250"
    fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  <path d="M 132 26 C 75 35, 34 95, 36 160 C 38 205, 48 235, 72 250"
    fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" opacity="0.7" />
  <g transform="translate(75, 252) rotate(15)">
    <use href="#secondStageOcto" />
  </g>

  <!-- HOSE 3: BCD INFLATOR HOSE (TOP RIGHT) - ROTATED 90° IN-LINE WITH HOSE -->
  <path d="M 148 20 C 178 12, 212 18, 222 42"
    fill="none" stroke="#0f172a" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 148 20 C 178 12, 212 18, 222 42"
    fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />
  <!-- Coupler now rotated -38° (90° turn) so the hose feeds straight into the boot, with the socket pointing toward the top-right -->
  <g transform="translate(228, 48) rotate(-38)">
    <use href="#qdFitting" />
  </g>

  <!-- HOSE 4: PRESSURE GAUGE / SPG (BOTTOM RIGHT) -->
  <path d="M 148 26 C 205 35, 244 95, 242 160 C 240 205, 230 235, 206 250"
    fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 148 26 C 205 35, 244 95, 242 160 C 240 205, 230 235, 206 250"
    fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round" opacity="0.6" />
  <g transform="translate(202, 253) rotate(-18)">
    <use href="#spg" />
  </g>
</svg>

